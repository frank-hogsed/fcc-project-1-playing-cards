<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Playing Cards</h1>
    <main id="playing-cards">
        <!-- Ace of Spades -->
        <div class="card">
            <div class="left">
                <div>A</div>
                <div>&spades;</div>
            </div>
            <div class="middle">
                <div>&spades;</div>
            </div>
            <div class="right">
                <div class="inverted">&spades;</div>
                <div class="inverted">A</div>
            </div>
        </div>

        <!-- 2 of Clubs -->
        <div class="card">
            <div class="left">
                <div>2</div>
                <div>&clubs;</div>
            </div>
            <div class="middle">
                <div>&clubs;</div>
                <div class="inverted">&clubs;</div>
            </div>
            <div class="right">
                <div class="inverted">&clubs;</div>
                <div class="inverted">2</div>
            </div>
        </div>

        <!-- 3 of Hearts -->
        <div class="card red">
            <div class="left">
                <div>3</div>
                <div>&hearts;</div>
            </div>
            <div class="middle">
                <div>&hearts;</div>
                <div>&hearts;</div>
                <div class="inverted">&hearts;</div>
            </div>
            <div class="right">
                <div class="inverted">&hearts;</div>
                <div class="inverted">3</div>
            </div>
        </div>

        <!-- 4 of Diamonds -->
        <div class="card red card-4">
            <div class="left">
                <div>4</div>
                <div>&diams;</div>
            </div>
            <!-- The middle container holds 4 diamonds -->
            <div class="middle">
                <div>&diams;</div>
                <div>&diams;</div>
                <div class="inverted">&diams;</div>
                <div class="inverted">&diams;</div>
            </div>
            <div class="right">
                <div class="inverted">&diams;</div>
                <div class="inverted">4</div>
            </div>
        </div>

        <!-- 5 of Clubs -->
        <div class="card card-5">
            <div class="left">
                <div>5</div>
                <div>&clubs;</div>
            </div>
            <!-- The middle container holds 5 clubs -->
            <div class="middle">
                <div>&clubs;</div>
                <div>&clubs;</div>
                <div>&clubs;</div>
                <div class="inverted">&clubs;</div>
                <div class="inverted">&clubs;</div>
            </div>
            <div class="right">
                <div class="inverted">&clubs;</div>
                <div class="inverted">5</div>
            </div>
        </div>
    </main>
</body>
</html>
